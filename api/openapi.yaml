              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/media/scrape:
    post:
      summary: Queue library-wide NFO/poster gap filling
      operationId: startMediaScrape
      description: >-
        Queues protected sidecar checks for eligible already-imported files.
        Queued, running and review-required jobs are skipped. Completed jobs may
        be explicitly checked again to fill missing artifacts. Existing files
        are always preserved; a recorded success is not proof of current file existence.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMediaScrapeRequest'
      responses:
        '200':
          description: Batch receipt (the original one for a repeated command key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaScrapeBatch'
        '400':
          description: Invalid command or nothing to queue
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current administrator session required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: State unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Read scrape preview and the latest batch progress
      operationId: readMediaScrape
      parameters:
        - name: command_key
          in: query
          schema: {type: string, maxLength: 128}
          description: Read only the current account original batch receipt for this command.
      responses:
        '200':
          description: Preview counts and the latest batch, if any
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaScrapeStatus'
        '400':
          description: Invalid original command key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current administrator session required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: State unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
