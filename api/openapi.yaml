  /api/v1/download-clients/{id}/seeding/config:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: readSeedingConfig
      summary: Read downloader seeding eligibility configuration
      description: Current administrator Cookie session only. Database read; no native calls or tasks. All responses are private, no-store.
      responses:
        '200':
          description: Current configuration or explicit null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeedingConfigRead'}
        default:
          description: Authentication, validation, missing client or storage failure
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      operationId: saveSeedingConfig
      summary: Save versioned keep-data seeding eligibility rules
      description: Binds the current downloader timestamp and configuration digest. Original-key recovery precedes current-version validation. Saving atomically persists rules, audit, event and receipt without scheduling removal or performing network or file I/O. All responses are private, no-store.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9:_.-]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SeedingConfigInput'}
      responses:
        '200':
          description: Original saved configuration result; persistence only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeedingConfigReceipt'}
        default:
          description: Authentication, validation, version conflict or storage failure
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/download-clients/{id}/seeding/config/commands/{command_key}:
    get:
      operationId: readSeedingConfigReceipt
      summary: Read an administrator-scoped original seeding configuration receipt
      description: Read-only original result for this account and downloader. Does not read the native client, retry a save or schedule removal. All responses are private, no-store.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: command_key, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9:_.-]+$'}}
      responses:
        '200':
          description: Original saved configuration result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeedingConfigReceipt'}
        default:
          description: Authentication, validation, missing receipt or storage failure
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

components:
  parameters:
    MediaRequestKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9:_.-]+$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 160}
  responses:
    MediaRequestFailure:
      description: Cookie session required (401/403); invalid input (400/422), missing record (404), version or original-key conflict (409), pending limit (429), or unverifiable storage/metadata result (503). All responses are private and no-store.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyBadRequest:
      description: Invalid policy command or draft rules
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyUnauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyForbidden:
      description: Administrator required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyNotFound:
      description: Frozen policy revision not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyConflict:
      description: Policy version or command fingerprint changed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyUnavailable:
      description: Policy repository unavailable; no fallback rules assumed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    PersonFollowBindings:
      type: object
      additionalProperties: false
      required: [indexer_ids]
      properties:
        indexer_ids:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string, format: uuid}
        downloader_id: {type: string, format: uuid}
    PersonFollowSettings:
      type: object
      additionalProperties: false
      required: [person_id, role, enabled, min_release_date, interval_minutes, quality_policy_id, quality_policy_revision]
      properties:
        person_id: {type: integer, format: int64, minimum: 1}
        role: {type: string, enum: [actor, director]}
        enabled: {type: boolean}
        min_release_date: {type: string, format: date}
        interval_minutes: {type: integer, minimum: 15, maximum: 10080}
        movie_root_id: {type: string, format: uuid}
        tv_root_id: {type: string, format: uuid}
        quality_policy_id: {type: string, minLength: 1, maxLength: 128}
        quality_policy_revision: {type: integer, format: int64, minimum: 1}
        bindings:
          allOf:
            - {$ref: '#/components/schemas/PersonFollowBindings'}
          description: Omission preserves saved bindings; an empty indexer list clears them; a nonempty list requires a downloader
    PersonFollowConfiguration:
      type: object
      additionalProperties: false
      required: [id, owner_id, version, settings, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 1}
        settings: {$ref: '#/components/schemas/PersonFollowSettings'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PersonFollowReceipt:
      type: object
      additionalProperties: false
      required: [command_key, config]
      properties:
        command_key: {type: string}
        config: {$ref: '#/components/schemas/PersonFollowConfiguration'}
    WebPushConfiguration:
      type: object
      required: [enabled, version, public_key]
      properties:
        enabled: {type: boolean}
        version: {type: string}
        public_key: {type: string}
    WebPushDevice:
      type: object
      required: [id, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AuditTimelineEntry:
      type: object
      additionalProperties: false
      required: [id, actor_type, actor_id, action, target_type, target_id, created_at]
      properties:
        id: {type: string, format: uuid}
        actor_type: {type: string}
        actor_id: {type: string}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        created_at: {type: string, format: date-time}
    AuditTimelinePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditTimelineEntry'}
