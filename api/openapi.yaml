openapi: 3.0.3
info:
  title: PulseMedia API
  version: 0.1.0
  description: HTTP API specification for PulseMedia media automation hub.
paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: getHealthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      summary: Readiness check
      operationId: getReadyz
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: Service is unready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'

  /api/v1/system/status:
    get:
      summary: System status
      operationId: getSystemStatus
      description: Authenticated dashboard status. Only current administrators receive the data directory.
      responses:
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: API token lacks read scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: System status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/status:
    get:
      summary: Authentication and setup status
      operationId: getAuthStatus
      responses:
        '200':
          description: Auth status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'

  /api/v1/auth/setup:
    post:
      summary: Initial administrator setup
      operationId: setupAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '429':
          description: Authentication attempt budget or concurrency exhausted; retry after six seconds
          headers:
            Retry-After: {schema: {type: string}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '200':
          description: Initial setup successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid setup request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Admin already initialized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/tokens:
    get:
      operationId: listOwnTokens
      summary: List the signed-in user's token metadata; session required
      responses:
        '200':
          description: Own tokens including revoked and expired history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ManagedToken'}}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
    post:
      operationId: createOwnToken
      summary: Create an own read-only token; secret is returned once and never replayed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOwnTokenRequest'}
      responses:
        '200':
          description: Atomic receipt; replay omits secret, revoke and create anew if the first response was lost
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedTokenReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/auth/tokens/{id}/revoke:
    post:
      operationId: revokeOwnToken
      summary: Irreversibly revoke an own token; session required
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Atomic own-token revocation receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedTokenReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/auth/login:
    post:
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '429':
          description: Authentication attempt budget or concurrency exhausted; retry after six seconds
          headers:
            Retry-After: {schema: {type: string}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials format
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: User logout
      operationId: logout
      responses:
        '500':
          description: Session revocation could not be confirmed; cookie is retained
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
        '204':
          description: Logged out successfully
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/settings:
    get:
      summary: List system settings
      operationId: getSettings
      responses:
        '200':
          description: Settings list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsListResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/settings/{key}:
    put:
      summary: Update a setting with optimistic locking
      operationId: updateSetting
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingRequest'
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingItem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid setting command
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current administrator session required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key conflicts with another operation or resource
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Setting transaction unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Optimistic lock version conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/settings/{key}/commands/{request_key}:
    get:
      summary: Recover own setting command receipt without secret values
      operationId: getSettingCommand
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: request_key
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Original committed setting metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingItem'
        '400':
          description: Invalid command key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current administrator session required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Receipt not yet confirmed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Request key belongs to another command
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Receipt read unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/movies/acquire:
    post:
      summary: Acquire a movie release
      operationId: acquireMovie
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Binds retries to the original actor and complete acquisition command
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireMovieRequest'
      responses:
        '202':
          description: Movie acquisition accepted and dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquireMovieResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current user cannot execute or recover this command
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (already owned or reserved)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Acquisition transaction unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/library/catalog:
    get:
      operationId: listLibraryCatalog
      summary: Read current mapped library files in shared roots
      description: >-
        Returns active files and mappings in the shared library. Imported and confirmed are
        persisted facts, not quality approval. Does not return absolute roots, inode,
        download references, job payloads or inferred poster/sidecar status.
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
        - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Current bounded file-unit page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryCatalogPage'}
        '400':
          description: Invalid library page
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Library access denied
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Library temporarily unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/stream:
    get:
      summary: Observe neutral activity invalidations and requery scoped state
      operationId: getActivityStream
      description: >-
        Events carry only reset and an empty JSON object. Connect, reconnect,
        acknowledged commands and periodic hints request scoped GET queries.
        IDs are process local and do not promise durable event replay.
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        '200':
          description: A stream of reset hints; no private payload or log records
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User or explicit read scope required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Stream unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operations:
    get:
      summary: List visible persisted acquisition operations
      operationId: listOperations
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum: [active, review, all]
            default: active
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: Permission-filtered operation page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
        '400':
          description: Invalid page or cursor scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Persistent operation query unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operations/{id}:
    get:
      summary: Get operation status and lifecycle details
      operationId: getOperation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Operation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (member accessing other user's private operation)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Operation not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Operation status temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operations/{id}/complete-tv-organizations:
    get:
      operationId: listCompleteTVOrganizations
      summary: Read current persistent complete normal-season organization evidence
      description: >-
        Session administrator and current subscription owner only. At most one completed
        task is returned, with up to 1000 videos and attachment count. Current account and
        object checks precede sensitive reads in one repeatable-read snapshot. No file or
        network observation, writes, automatic confirmation or jobs. Relative paths only.
        can_confirm describes persistent evidence, not a file freshness or execution permit;
        explicit POST independently revalidates all evidence and observes files.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Bounded current persistent evidence, private and no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [task_id, operation_id, tracking_job_id, season, videos, attachment_count, organization_state, can_confirm]
                      properties:
                        task_id: {type: string, format: uuid}
                        operation_id: {type: string, format: uuid}
                        tracking_job_id: {type: string, format: uuid}
                        season: {type: integer, minimum: 1}
                        attachment_count: {type: integer, minimum: 0}
                        organization_state: {type: string}
                        can_confirm: {type: boolean}
                        videos:
                          type: array
                          maxItems: 1000
                          items:
                            type: object
                            additionalProperties: false
                            required: [unit_id, unit_key, source_relative, target_relative, size_bytes]
                            properties:
                              unit_id: {type: string, format: uuid}
                              unit_key: {type: string}
                              source_relative: {type: string}
                              target_relative: {type: string}
                              size_bytes: {type: integer, format: int64}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/operations/{id}/cancel:
    post:
      summary: Request cancellation; unsafe in-progress operations remain reserved pending review
      operationId: cancelOperation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Operation canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Operation not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cancellation requires downloader reconciliation and manual review
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/acquisitions/selected-movie/preview:
    post:
      operationId: previewSelectedMovie
      summary: Preview an explicitly selected movie, root and candidate; no acquisition writes
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MovieSelection'}
      responses:
        '200':
          description: Current selection observations and rules, not download authority
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MovieSelectionPreview'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
  /api/v1/acquisitions/selected-movie:
    post:
      operationId: commitSelectedMovie
      summary: Confirm movie target and persist acquisition atomically
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MovieSelectionCommand'}
      responses:
        '202':
          description: Stable target and acquisition receipt, not downloader acknowledgement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MovieSelectionReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/library-roots:
    get:
      operationId: listLibraryRootSelections
      summary: Read configured target-root selections; no filesystem paths or credentials
      responses:
        '200':
          description: Configured root references and observed gates, not proof of current filesystem availability
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/LibraryRootSelection'}}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/operations/{id}/submission-retry:
    get:
      operationId: previewSubmissionRetry
      summary: Preview retry of an original dead unsent submission
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Own original scope, never permission to replay unknown Add
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionRetryPreview'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
    post:
      operationId: commitSubmissionRetry
