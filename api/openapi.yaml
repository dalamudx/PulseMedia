openapi: 3.0.3
info:
  title: PulseMedia API
  version: 0.1.0
  description: HTTP API specification for PulseMedia media automation hub.
paths:
  /api/v1/metadata/bangumi/calendar:
    get:
      operationId: getBangumiCalendar
      summary: Read the Bangumi broadcast-weekday calendar
      description: Read-only metadata. Titles preserve Chinese and original names. First broadcast dates are not episode air dates. Bangumi subject IDs never grant TMDB or subscription execution authority. Every response is private, no-store.
      parameters:
        - {name: weekday, in: query, schema: {type: integer, minimum: 1, maximum: 7}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
      responses:
        '200':
          description: Valid current calendar, including a valid empty result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BangumiCalendarResponse'}
        '400':
          description: Invalid weekday or query
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Metadata read access denied
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Calendar temporarily unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/integrations/cookiecloud/config:
    get:
      operationId: readCookieCloudConfig
      summary: Read the current administrator's safe CookieCloud configuration
      description: Cookie session only. Database read; does not fetch cookies, enqueue synchronization or update sites. Every response is private, no-store.
      responses:
        '200':
          description: Existing configuration or explicit null
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config: {allOf: [{$ref: '#/components/schemas/CookieCloudConfig'}], nullable: true}
        default:
          description: Authentication, validation or storage failure
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      operationId: saveCookieCloudConfig
      summary: Persist an encrypted CookieCloud connection without starting synchronization
      description: Current administrator session and expected version required. Omitted connection preserves its exact stored ciphertext; null does not clear it. Original commands restore before new version validation. Receipts never contain the URL prefix, user key or password.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9:_.-]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CookieCloudConfigInput'}
      responses:
        '200':
          description: Original saved configuration result; persistence only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CookieCloudConfigReceipt'}
        default:
          description: Authentication, validation, conflict or storage failure
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/integrations/cookiecloud/config/commands/{command_key}:
    get:
      operationId: readCookieCloudConfigReceipt
      summary: Read an account-scoped original CookieCloud configuration receipt
      description: Cookie session only. Does not decrypt the connection, fetch cookies, retry a write or start synchronization. Every response is private, no-store.
      parameters:
        - {name: command_key, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9:_.-]+$'}}
      responses:
        '200':
          description: Original saved safe result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CookieCloudConfigReceipt'}
        default:
          description: Authentication, validation or storage failure
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/media-requests/summary:
    get:
      operationId: getMediaRequestSummary
      summary: Read the administrator inbox count without scheduling or metadata access
      responses:
        '200':
          description: Exact global count of pending requests; known zero is explicit
          content:
            application/json:
              schema:
                type: object
                required: [pending_count, observed_at]
                properties:
                  pending_count: {type: string, pattern: '^(0|[1-9][0-9]*)$', description: Exact nonnegative decimal count}
                  observed_at: {type: string, format: date-time}
        default: {$ref: '#/components/responses/MediaRequestFailure'}
  /api/v1/media-requests:
    get:
      operationId: listMediaRequests
      summary: List own requests; administrators can list all requests
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: before_id, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, description: Administrators only; pending excludes every terminal request, schema: {type: string, enum: [pending]}}
      responses:
        '200':
          description: Read-only account-scoped page; pagination is not a complete inventory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/MediaRequestDetails'}}
        default: {$ref: '#/components/responses/MediaRequestFailure'}
    post:
      operationId: submitMediaRequest
      summary: Persist a pending request without creating a subscription or performing metadata I/O
      parameters:
        - $ref: '#/components/parameters/MediaRequestKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaRequestIntent'}
      responses:
        '201':
          description: Original pending snapshot, including after a later decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaRequestCommandReceipt'}
        default: {$ref: '#/components/responses/MediaRequestFailure'}
  /api/v1/media-requests/commands/{idempotency_key}:
    get:
      operationId: getMediaRequestReceipt
      summary: Recover the current account's original submit or close receipt without retrying a write
      parameters:
        - {name: idempotency_key, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9:_.-]+$'}}
      responses:
        '200':
          description: Original immutable command receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaRequestCommandReceipt'}
        default: {$ref: '#/components/responses/MediaRequestFailure'}
  /api/v1/media-requests/{request_id}:
    get:
      operationId: getMediaRequest
      summary: Read current request state in the current account's object scope
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current request, not an execution permit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaRequestDetails'}
        default: {$ref: '#/components/responses/MediaRequestFailure'}
  /api/v1/media-requests/{request_id}/close:
    post:
      operationId: closeMediaRequest
      summary: Owner withdrawal or administrator rejection of a pending request
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/MediaRequestKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, action, reason]
              properties:
                expected_version: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
                action: {type: string, enum: [reject, withdraw]}
                reason: {type: string, maxLength: 512}
      responses:
        '200':
          description: Original terminal decision snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaRequestCommandReceipt'}
        default: {$ref: '#/components/responses/MediaRequestFailure'}
  /api/v1/media-requests/{request_id}/approve:
    post:
      operationId: approveMediaRequest
      summary: Administrator approval through the existing atomic subscription creation transaction
      description: Media identity, owner, and season scope come from the saved request. Approval does not send a download directly. The ordinary scheduler consumes eligible Wanted after commit.
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/MediaRequestKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, root_id, quality_policy_id, indexer_ids, downloader_id]
              properties:
                expected_version: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
                root_id: {type: string, format: uuid}
                quality_policy_id: {type: string, minLength: 1, maxLength: 128}
                indexer_ids: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string, format: uuid}}
                downloader_id: {type: string, format: uuid}
      responses:
        '201':
          description: Original subscription result; approval and creation are committed together
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaRequestApprovalResult'}
        default: {$ref: '#/components/responses/MediaRequestFailure'}
  /api/v1/media-requests/{request_id}/approval-commands/{idempotency_key}:
    get:
      operationId: getMediaRequestApprovalReceipt
      summary: Recover the original approving administrator's receipt without metadata or download I/O
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: idempotency_key, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9:_.-]+$'}}
      responses:
        '200':
          description: Original approved subscription result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaRequestApprovalResult'}
        default: {$ref: '#/components/responses/MediaRequestFailure'}
  /healthz:
    get:
      summary: Liveness check
      operationId: getHealthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      summary: Readiness check
      operationId: getReadyz
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: Service is unready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'

  /api/v1/system/status:
    get:
      summary: System status
      operationId: getSystemStatus
      description: Authenticated dashboard status. Only current administrators receive the data directory.
      responses:
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: API token lacks read scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: System status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/system/logs:
    get:
      summary: Real-time system log stream
      operationId: streamSystemLogs
      description: Real-time Server-Sent Events stream of system logs and audit records. Restricted to current administrator sessions.
      parameters:
        - name: level
          in: query
          required: false
          description: Minimum log level filter (DEBUG, INFO, WARN, ERROR).
          schema:
            type: string
            enum: [DEBUG, INFO, WARN, ERROR]
      responses:
        '200':
          description: Event stream established
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current administrator session required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Log stream unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/system/audit:
    get:
      operationId: listAuditTimeline
      summary: Read the persisted system audit timeline
      description: Current administrators only, using a session or a valid read-scoped API token. Reads existing transactional audit records without emitting new audit entries. Historical JSON payloads are never returned. Descending timestamp and UUID cursor pagination; no total count or cross-page snapshot guarantee. Cursors retain their position if the corresponding old record is removed by retention.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}, description: Page size; defaults to 50.}
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 1024}, description: Opaque continuation bound to the account and filters.}
        - {name: actor_type, in: query, schema: {type: string, enum: [user, service, system]}}
        - {name: actor_id, in: query, schema: {type: string, minLength: 1, maxLength: 256}, description: Exact historical actor identifier.}
        - {name: action, in: query, schema: {type: string, minLength: 1, maxLength: 256}, description: Exact action; no wildcard matching.}
        - {name: target_type, in: query, schema: {type: string, minLength: 1, maxLength: 256}}
        - {name: target_id, in: query, schema: {type: string, minLength: 1, maxLength: 256}}
        - {name: from, in: query, schema: {type: string, format: date-time}, description: Inclusive timestamp with at most microsecond precision.}
        - {name: until, in: query, schema: {type: string, format: date-time}, description: Exclusive timestamp with at most microsecond precision.}
      responses:
        '200':
          description: Persisted audit summaries; an empty list is a successful read, not a storage failure.
          headers:
            Cache-Control: {schema: {type: string, enum: ['private, no-store']}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditTimelinePage'}
        '400':
          description: Invalid filter or cursor
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Current administrator access required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Audit storage unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/auth/status:
    get:
      summary: Authentication and setup status
      operationId: getAuthStatus
      responses:
        '200':
          description: Auth status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'

  /api/v1/auth/setup:
    post:
      summary: Initial administrator setup
      operationId: setupAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '429':
          description: Authentication attempt budget or concurrency exhausted; retry after six seconds
          headers:
            Retry-After: {schema: {type: string}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '200':
          description: Initial setup successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid setup request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Admin already initialized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/tokens:
    get:
      operationId: listOwnTokens
      summary: List the signed-in user's token metadata; session required
      responses:
        '200':
          description: Own tokens including revoked and expired history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ManagedToken'}}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
    post:
      operationId: createOwnToken
      summary: Create an own read-only token; secret is returned once and never replayed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOwnTokenRequest'}
      responses:
        '200':
          description: Atomic receipt; replay omits secret, revoke and create anew if the first response was lost
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedTokenReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/auth/tokens/{id}/revoke:
    post:
      operationId: revokeOwnToken
      summary: Irreversibly revoke an own token; session required
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Atomic own-token revocation receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedTokenReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/auth/login:
    post:
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '429':
          description: Authentication attempt budget or concurrency exhausted; retry after six seconds
          headers:
            Retry-After: {schema: {type: string}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials format
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: User logout
      operationId: logout
      responses:
        '500':
          description: Session revocation could not be confirmed; cookie is retained
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
        '204':
          description: Logged out successfully
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/settings:
    get:
      summary: List system settings
      operationId: getSettings
      responses:
        '200':
          description: Settings list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsListResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/settings/{key}:
    put:
      summary: Update a setting with optimistic locking
      operationId: updateSetting
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingRequest'
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingItem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid setting command
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current administrator session required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key conflicts with another operation or resource
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Setting transaction unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Optimistic lock version conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/settings/{key}/commands/{request_key}:
    get:
      summary: Recover own setting command receipt without secret values
      operationId: getSettingCommand
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: request_key
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Original committed setting metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingItem'
        '400':
          description: Invalid command key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current administrator session required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Receipt not yet confirmed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Request key belongs to another command
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Receipt read unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/movies/acquire:
    post:
      summary: Acquire a movie release
      operationId: acquireMovie
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Binds retries to the original actor and complete acquisition command
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireMovieRequest'
      responses:
        '202':
          description: Movie acquisition accepted and dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquireMovieResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current user cannot execute or recover this command
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (already owned or reserved)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Acquisition transaction unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/organization/naming/preview:
    post:
      operationId: previewNaming
      summary: Preview a draft or saved naming template against sample metadata
      description: >-
        Current administrator sessions only. Formats sample metadata without network or file I/O,
        creating jobs, or granting organization authority. Omit templates to use the committed settings;
        supply both template strings for a draft. Empty templates preserve canonical naming.
        Unknown facts required by a template are rejected. release_title supplies parsed sample quality
        facts only; all output remains a preview and must not be used as execution evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NamingPreviewRequest'}
      responses:
        '200':
          description: Relative sample path and configuration version, without execution permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NamingPreviewResult'}
        '400':
          description: Invalid template, sample metadata or unavailable required field
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Current administrator session required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Settings snapshot unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/download-clients/global-rates:
    get:
      operationId: getDownloadGlobalRates
      summary: Read persisted global native download and upload rates
      description: >-
        Administrator sessions only. Reads a consistent database snapshot without probing clients,
        creating jobs, or changing limits. Missing, failed, stale and configuration-mismatched samples
        are unknown. A direction has a global total only when every configured supported client
        contributes a fresh value. Decimal strings preserve integer precision. Historical points
        use the latest observation as of each time and preserve gaps; last-good values are historical.
      responses:
        '200':
          description: Persisted native rate snapshot including collection state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadGlobalRatesOverview'}
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Current administrator session required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Snapshot unavailable, never an empty successful fallback
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/library/overview:
    get:
      operationId: getLibraryOverview
      summary: Read registered shared-library facts and capacity observations
      description: >-
        Counts distinct works, TV units and files with current imported facts. Offline roots
        retain registered counts. Capacity is a per-root persisted scan sample, never summed
        across roots or collected by this request. Recent arrivals use first file import history;
        corrections do not mint a new arrival. No absolute paths or execution permission.
      parameters:
        - {name: recent_limit, in: query, schema: {type: integer, default: 12, minimum: 1, maximum: 24}}
      responses:
        '200':
          description: Consistent read-only library snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryOverview'}
        '400':
          description: Invalid result limit
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Current account or read permission denied
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Library storage unavailable; never an empty success
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/dashboard/activity:
    get:
      operationId: getDashboardActivity
      summary: Read visible persisted operation activity without probing clients
      description: >-
        Members see their own demand and administrators see all visible operations. Active
        also includes unknown, review and organization states. Progress is nullable with its
        source; native_percent is stored downloader percentage, verified_bytes is a validated
        automatic TV observation. Updated time is the task record or TV observation time,
        not a promise of a new client probe. No cumulative transfer-byte ratio is inferred.
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 6, minimum: 1, maximum: 12}}
      responses:
        '200':
          description: Bounded scoped activity snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardActivityPage'}
        '400':
          description: Invalid result limit
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Current account or read permission denied
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Activity storage unavailable; never an empty success
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/library/catalog:
    get:
      operationId: listLibraryCatalog
      summary: Read current mapped library files in shared roots
      description: >-
