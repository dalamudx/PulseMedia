        '403':
          description: User or explicit read scope required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Stream unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

