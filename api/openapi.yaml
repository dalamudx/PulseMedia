        '200':
          description: Audited skip receipt; original event and consumer unchanged, never a delivered receipt
          content:
            application/json:
              schema:
                type: object
                required: [id, event_id, state, lease_token, reason, skipped_at]
                properties:
                  id: {type: string, format: uuid}
                  event_id: {type: string, format: uuid}
                  state: {type: string, enum: [skipped]}
                  lease_token: {type: integer, format: int64}
                  reason: {type: string}
                  skipped_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/integrations/deliveries/{id}/replay:
    post:
      operationId: replayIntegrationDelivery
      summary: Explicit duplicate-risk acknowledged replay of a dead integration delivery
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_token, expected_attempts, expected_updated_at, accept_duplicate_risk]
              properties:
                expected_token: {type: integer, format: int64, minimum: 0}
                expected_attempts: {type: integer, minimum: 1}
                expected_updated_at: {type: string, format: date-time}
                accept_duplicate_risk: {type: boolean}
      responses:
        '200':
          description: Requeued original event and recipient; not a successful network send
          content:
            application/json:
              schema:
                type: object
                required: [id, event_id, state, lease_token]
                properties:
                  id: {type: string, format: uuid}
                  event_id: {type: string, format: uuid}
                  state: {type: string}
                  lease_token: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
