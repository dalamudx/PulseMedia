          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '403':
          description: Administrator required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
