  /api/v1/indexers/{id}/rss:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getIndexerRSS
      summary: Read sanitized RSS configuration and last successful poll receipt (admin only)
      responses:
        '200':
          description: Configuration without URL or credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndexerRSSDetails'}
        '403': &rssForbidden
          description: Administrator required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404': &rssNotFound
          description: Indexer not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': &rssUnavailable
          description: Service unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      operationId: configureIndexerRSS
      summary: Explicitly enable or disable durable RSS polling (admin only)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IndexerRSSRequest'}
      responses:
        '200':
          description: Stable replayable configuration receipt without secrets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndexerRSSDetails'}
        '400':
          description: Invalid RSS configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403': *rssForbidden
        '404': *rssNotFound
        '409':
          description: Configuration version or idempotency fingerprint conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': *rssUnavailable

