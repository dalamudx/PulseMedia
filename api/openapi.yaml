      summary: Observe original frozen hardlink under physical slot; not execution or import success
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current observation or hold reason, no new file operations
          content:
            application/json:
              schema:
                type: object
                required: [plan_id, task_id, input_stamp, observed_at, recoverable, reason]
                properties:
                  plan_id: {type: string, format: uuid}
                  task_id: {type: string, format: uuid}
                  input_stamp: {type: string}
                  observed_at: {type: string, format: date-time}
                  recoverable: {type: boolean}
                  reason: {type: string}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
    post:
      operationId: commitOriginalTransferRecovery
      summary: Explicit original administrator recovery of observed original hardlink; never re-sign or repeat Add
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 140}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_input_stamp, confirmed, reason]
              properties:
                expected_input_stamp: {type: string, pattern: '^[0-9a-f]{64}$'}
                confirmed: {type: boolean, enum: [true]}
                reason: {type: string, minLength: 1, maxLength: 240}
      responses:
        '202':
          description: New organization job queued against original plan; not proof of imported or delivered
          content:
            application/json:
              schema:
                type: object
                required: [plan_id, task_id, job_id, state]
                properties:
                  plan_id: {type: string, format: uuid}
                  task_id: {type: string, format: uuid}
                  job_id: {type: string, format: uuid}
                  state: {type: string, enum: [queued_original_plan]}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/library/reuse-previews:
    post:
      operationId: previewLibraryReuse
