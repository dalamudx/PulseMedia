          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequirementWithdrawalReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/transfer-plans/{id}/recovery:
    get:
      operationId: previewOriginalTransferRecovery
      summary: Observe original frozen hardlink under physical slot; not execution or import success
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current observation or hold reason, no new file operations
          content:
            application/json:
              schema:
                type: object
                required: [plan_id, task_id, input_stamp, observed_at, recoverable, reason]
                properties:
                  plan_id: {type: string, format: uuid}
                  task_id: {type: string, format: uuid}
                  input_stamp: {type: string}
                  observed_at: {type: string, format: date-time}
                  recoverable: {type: boolean}
                  reason: {type: string}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
    post:
      operationId: commitOriginalTransferRecovery
      summary: Explicit original administrator recovery of observed original hardlink; never re-sign or repeat Add
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 140}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_input_stamp, confirmed, reason]
              properties:
                expected_input_stamp: {type: string, pattern: '^[0-9a-f]{64}$'}
                confirmed: {type: boolean, enum: [true]}
                reason: {type: string, minLength: 1, maxLength: 240}
      responses:
        '202':
          description: New organization job queued against original plan; not proof of imported or delivered
          content:
            application/json:
              schema:
                type: object
                required: [plan_id, task_id, job_id, state]
                properties:
                  plan_id: {type: string, format: uuid}
                  task_id: {type: string, format: uuid}
                  job_id: {type: string, format: uuid}
                  state: {type: string, enum: [queued_original_plan]}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/library/reuse-previews:
    post:
      operationId: previewLibraryReuse
      summary: Preview up to 20 target demands in one snapshot without creating work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targets]
              properties:
                targets:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {$ref: '#/components/schemas/LibraryReuseTarget'}
      responses:
        '200':
          description: Complete candidate evidence; a source in another root is not target ownership
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LibraryReusePreview'}}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
  /api/v1/library/reuses:
    get:
      operationId: listLibraryReuses
      summary: List the current administrator's local reuse demands
      responses:
        '200':
          description: Local plan states; completed means the complete file mapping was imported
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LibraryReuseStatus'}}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
    post:
      operationId: confirmLibraryReuse
      summary: Confirm complete source coverage and queue a local demand atomically
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 140}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryReuseCommand'}
      responses:
        '202':
          description: Frozen plan queued; repeat the original body and key after a lost response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryReuseReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
  /api/v1/transfer-plans/{id}/revision-preview:
    post:
      operationId: previewTransferRevision
      summary: Observe a missing-target single-movie successor, without file mutations
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_rel]
              properties:
                target_rel: {type: string, minLength: 1, maxLength: 1024}
                action: {type: string, enum: [hardlink, copy, reflink, move], description: "Explicit file action; omitted uses hardlink. Move removes the source path after verified publication."}
      responses:
        '200':
          description: Current target-revision observation; not download authorization
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferRevisionPreview'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
  /api/v1/transfer-plans/{id}/revision:
    post:
      operationId: commitTransferRevision
      summary: Queue a frozen successor of an ended original plan; preserves original history
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 140}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_rel, expected_input_stamp, confirmed, reason]
              properties:
                target_rel: {type: string, minLength: 1, maxLength: 1024}
                action: {type: string, enum: [hardlink, copy, reflink, move]}
                expected_input_stamp: {type: string, pattern: '^[0-9a-f]{64}$'}
                confirmed: {type: boolean, enum: [true]}
                reason: {type: string, minLength: 1, maxLength: 240}
      responses:
        '202':
          description: New frozen plan queued, not proof of imported or delivered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferRevisionReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/transfer-plans/{id}/approve:
    post:
      summary: Legacy approval entry requires original-plan review
      deprecated: true
      description: This compatibility entry does not execute plans. Administrators receive PLAN_APPROVAL_REQUIRES_REVIEW; confirmed original-plan recovery uses its dedicated preview and command endpoints.
      operationId: approveTransferPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Legacy approval is unavailable; obtain a confirmed original-plan recovery preview
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/search/movies:
    get:
      summary: Search movie and TV metadata
      operationId: searchMovieReleases
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [all, movie, tv, multi]
            default: all
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 1800
            maximum: 9999
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieSearchResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '400':
          description: Invalid metadata search input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current account lacks catalog read access
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Metadata provider or catalog unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/subscriptions:
    get:
      summary: List subscriptions for current user or all if admin
      operationId: listSubscriptions
      responses:
        '200':
          description: Subscriptions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new subscription
      operationId: createSubscription
      description: Persists a versioned subscription command and its original result atomically. Retry the original key after an uncertain response; no provider lookup occurs for an existing receipt.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDetails'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current account cannot create subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Media, root, or current subscription object not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Key, intent, root or metadata version changed; reread before changing the original command
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Metadata or subscription storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/subscription-commands/{idempotency_key}:
    get:
      operationId: getSubscriptionCreationReceipt
      summary: Read the original subscription creation result
      description: Current-account and object-authorized pure read. No metadata calls, subscription mutation, or new jobs. A missing receipt does not confirm that an earlier request was never sent.
      parameters:
        - name: idempotency_key
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      responses:
        '200':
          description: Original persisted subscription creation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionDetails'}
        '400':
          description: Invalid key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Authentication required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Current account cannot read this command
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: No readable original command receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Receipt could not be verified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/subscriptions/{id}/status:
    get:
      operationId: getSubscriptionStatus
      summary: Read current derived wanted status without changing projections
      description: Authorized read-only database snapshot. Observed status is not permission to submit downloads. No network or filesystem probe is performed.
      tags: [Subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Consistent current database status, not cached wanted projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionStatusReport'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden object
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Missing subscription
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Could not observe status; never an empty success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/subscriptions/{id}/bindings:
    put:
      summary: Update endpoint bindings without changing state or TV scope
      operationId: configureSubscriptionBindings
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionBindingsRequest'
      responses:
        '200':
          description: Bindings saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionBindingsDetails'
        '400':
          description: Invalid binding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Intent or command fingerprint changed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Temporarily unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/library/mapping-options:
    get:
      operationId: getFileMappingOptions
      summary: Administrator index and persisted media choices, latest 100 only; not evidence of physical presence
      responses:
        '200':
          description: Current choices
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileMappingOptions'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
  /api/v1/library/files/{id}/mapping:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: previewFileMapping
      summary: Read-only current imported evidence and metadata snapshot for an explicit semantic correction
      parameters:
        - {name: media_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Snapshot including active and historical associations, not a new filesystem verification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileMappingPreview'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
    post:
      operationId: correctFileMapping
      summary: Explicit coverage correction only; never move files or start downloads
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [media_id, unit_ids, expected_stamp, confirmed_coverage]
              properties:
                media_id: {type: string, format: uuid}
                unit_ids: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}}
                expected_stamp: {type: string, pattern: '^[a-f0-9]{64}$'}
                confirmed_coverage: {type: boolean}
      responses:
        '200':
          description: Stable mapping revision receipt; source facts and history changed atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileMappingReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/integrations/notification-batches:
    get:
      operationId: listNotificationBatches
      summary: Administrator recent 100 immutable media notification batch observations; never a send receipt
      responses:
        '200':
          description: Current batch and original recipient/delivery snapshot
          content:
            application/json:
              schema:
                type: object
                required: [items, limit]
                properties:
                  limit: {type: integer}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/NotificationBatchSummary'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/integrations/deliveries:
    get:
      operationId: listIntegrationDeliveries
      summary: Administrator delivery observations, latest 100 only; no payload or credentials
      responses:
        '200':
          description: Recent deliveries, not a complete history
          content:
            application/json:
              schema:
                type: object
                required: [items, limit]
                properties:
                  limit: {type: integer}
                  items: {type: array, items: {$ref: '#/components/schemas/DeliverySummary'}}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
  /api/v1/integrations/deliveries/{id}/skip:
    post:
      operationId: skipIntegrationDelivery
      summary: Administrator audited skip of a dead original delivery; not confirmation of delivery or cancellation of a running send
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_token, expected_attempts, expected_updated_at, accept_delivery_loss, reason]
              properties:
                expected_token: {type: integer, format: int64, minimum: 0}
                expected_attempts: {type: integer, minimum: 0, maximum: 2147483647}
                expected_updated_at: {type: string, format: date-time}
                accept_delivery_loss: {type: boolean}
                reason: {type: string, enum: [handled_elsewhere, recipient_retired, event_obsolete]}
      responses:
        '200':
          description: Audited skip receipt; original event and consumer unchanged, never a delivered receipt
          content:
            application/json:
              schema:
                type: object
                required: [id, event_id, state, lease_token, reason, skipped_at]
                properties:
                  id: {type: string, format: uuid}
                  event_id: {type: string, format: uuid}
                  state: {type: string, enum: [skipped]}
                  lease_token: {type: integer, format: int64}
                  reason: {type: string}
                  skipped_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/integrations/deliveries/{id}/replay:
    post:
      operationId: replayIntegrationDelivery
      summary: Explicit duplicate-risk acknowledged replay of a dead integration delivery
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_token, expected_attempts, expected_updated_at, accept_duplicate_risk]
              properties:
                expected_token: {type: integer, format: int64, minimum: 0}
                expected_attempts: {type: integer, minimum: 1}
                expected_updated_at: {type: string, format: date-time}
                accept_duplicate_risk: {type: boolean}
      responses:
        '200':
          description: Requeued original event and recipient; not a successful network send
          content:
            application/json:
              schema:
                type: object
                required: [id, event_id, state, lease_token]
                properties:
                  id: {type: string, format: uuid}
                  event_id: {type: string, format: uuid}
                  state: {type: string}
                  lease_token: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/subscriptions/{id}/episode-mapping:
    get:
      operationId: getEpisodeMapping
      summary: Current read-only validity of the approved numbering revision, not ownership/acquisition
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Approved revision and current fences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EpisodeMappingState'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
    post:
      operationId: publishEpisodeMapping
      summary: Administrator reviewed revision and subscription binding in one transaction; no download or file mutation
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EpisodeMappingCommand'}
      responses:
        '200':
          description: Stable publication receipt, not current validity or delivery/completion
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EpisodeMappingReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
  /api/v1/subscriptions/{id}/episode-mapping/preview:
    post:
      operationId: previewEpisodeMapping
      summary: Complete read-only preview of explicit manual rows or selected numbering source; cannot authorize acquisition
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EpisodeMappingDraft'}
      responses:
        '200':
          description: Exact rows, context/source fingerprints or hold reason
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EpisodeMappingPreview'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/subscriptions/{id}/episode-mapping/explain-release:
    post:
      operationId: explainMappedRelease
      summary: Read-only approved absolute-numbering explanation, never execution authority
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - {required: [name], not: {required: [candidate_id]}}
                - {required: [candidate_id], not: {required: [name]}}
              properties:
                name: {type: string, minLength: 1, maxLength: 512}
                candidate_id: {type: string, format: uuid}
      responses:
        '200':
          description: Current frozen numbering evidence only
