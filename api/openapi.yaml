          type: array
          items:
            type: string


    SubscriptionBindingsRequest:
      type: object
      additionalProperties: false
      required: [indexer_ids, downloader_id, expected_version]
      properties:
        indexer_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, format: uuid}
          description: Explicit endpoints. Empty disables automatic search.
        downloader_id:
          type: string
          format: uuid
          nullable: true
          description: Null clears the downloader binding.
        quality_policy_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional; select the published current revision under the same intent fence. Omitted preserves the frozen policy reference.
        expected_version: {type: integer, format: int64, minimum: 1}
    SubscriptionBindingsDetails:
      type: object
      required: [id, state, intent_version, indexer_ids, downloader_id]
