  /api/v1/operations/{id}/submission-retry:
    get:
      operationId: previewSubmissionRetry
      summary: Preview retry of an original dead unsent submission
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Own original scope, never permission to replay unknown Add
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionRetryPreview'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
    post:
      operationId: commitSubmissionRetry
      summary: Requeue only original dead unsent job, preserving its frozen scope
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id, expected_input_stamp, acknowledged]
              properties:
                job_id: {type: string, format: uuid}
                expected_input_stamp: {type: string, pattern: '^[a-f0-9]{64}$'}
                acknowledged: {type: boolean, enum: [true]}
      responses:
        '202':
          description: Original job queued, not proof of submission or import
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionRetryReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}
  /api/v1/operations/{id}/requirements:
    get:
      operationId: listOwnOperationRequirements
      summary: Read only the actor's own requirements; not other subscribers
      parameters:
