        '503': {$ref: '#/components/responses/PolicyUnavailable'}
  /api/v1/operations/{id}/requirements/{requirement_id}/withdraw:
    post:
      operationId: withdrawOwnRequirement
      summary: Withdraw only this actor's requirement; do not promise recall of an external action
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: requirement_id, in: path, required: true, schema: {type: string, format: uuid}}
