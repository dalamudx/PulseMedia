    PolicyRuleSet:
      type: object
      additionalProperties: false
      required: [cutoff_score, prefer_hdr, resolution_order, source_order, reject_terms, reject_groups]
      properties:
        cutoff_score: {type: integer, minimum: 0, maximum: 200015}
        prefer_hdr: {type: boolean}
        resolution_order:
          type: object
          minProperties: 1
          maxProperties: 4
          additionalProperties: {type: integer, minimum: 0, maximum: 100000}
        source_order:
          type: object
          minProperties: 1
          maxProperties: 5
          additionalProperties: {type: integer, minimum: 0, maximum: 100000}
        reject_terms: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        reject_groups: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
    PolicyDocument:
      type: object
      required: [id, name, revision, rules]
      properties:
        id: {type: string}
        name: {type: string}
        revision: {type: integer, format: int64}
        rules: {$ref: '#/components/schemas/PolicyRuleSet'}
    CreatePolicyRequest:
      type: object
      additionalProperties: false
      required: [id, name, rules]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
        name: {type: string, minLength: 1, maxLength: 128}
        rules: {$ref: '#/components/schemas/PolicyRuleSet'}
    PublishPolicyRequest:
      type: object
      additionalProperties: false
