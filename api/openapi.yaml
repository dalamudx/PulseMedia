        '200':
          description: Checkin result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinIndexerResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
