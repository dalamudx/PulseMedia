              type: object
              additionalProperties: false
              required: [expected_updated_at, is_enabled]
              properties:
                expected_updated_at: {type: string, format: date-time}
                is_enabled: {type: boolean}
      responses:
        '200':
          description: Stable state command receipt, not delivery confirmation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelStateReceipt'}
        '400': {$ref: '#/components/responses/PolicyBadRequest'}
        '401': {$ref: '#/components/responses/PolicyUnauthorized'}
        '403': {$ref: '#/components/responses/PolicyForbidden'}
        '404': {$ref: '#/components/responses/PolicyNotFound'}
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '503': {$ref: '#/components/responses/PolicyUnavailable'}

  /api/v1/notification-channels/{id}:
    delete:
      operationId: disableNotificationChannel
      deprecated: true
      summary: Retired unfenced mutation; use versioned channel state command
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '409': {$ref: '#/components/responses/PolicyConflict'}
        '403':
          description: Administrator required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Channel not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 160}
  responses:
    PolicyBadRequest:
      description: Invalid policy command or draft rules
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyUnauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyForbidden:
      description: Administrator required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyNotFound:
      description: Frozen policy revision not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyConflict:
      description: Policy version or command fingerprint changed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PolicyUnavailable:
      description: Policy repository unavailable; no fallback rules assumed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    LibraryReuseTarget:
      type: object
      additionalProperties: false
      required: [unit_id, root_id, policy_id, policy_revision]
      properties:
        unit_id: {type: string, format: uuid}
        root_id: {type: string, format: uuid}
        subscription_id: {type: string, format: uuid}
        policy_id: {type: string, minLength: 1}
        policy_revision: {type: integer, format: int64, minimum: 1}
    LibraryReuseCandidate:
      type: object
      required: [file_id, root_id, root_name, rel_path, unit_ids, unit_keys, quality, score, source_available, qualified, wait_reason]
      properties:
        file_id: {type: string, format: uuid}
        root_id: {type: string, format: uuid}
        root_name: {type: string}
        rel_path: {type: string}
        unit_ids: {type: array, items: {type: string, format: uuid}}
        unit_keys: {type: array, items: {type: string}}
        quality: {type: object, additionalProperties: true}
        score: {type: integer}
        source_available: {type: boolean}
        qualified: {type: boolean}
        wait_reason: {type: string}
    LibraryReusePreview:
      type: object
      required: [target, media_id, media_type, unit_key, already_owned, ownership_unknown, complete, candidates, input_stamp, can_confirm, wait_reason]
      properties:
        target: {$ref: '#/components/schemas/LibraryReuseTarget'}
        media_id: {type: string, format: uuid}
        media_type: {type: string, enum: [movie, tv]}
        unit_key: {type: string}
        already_owned: {type: boolean}
        ownership_unknown: {type: boolean}
        complete: {type: boolean}
        candidates: {type: array, items: {$ref: '#/components/schemas/LibraryReuseCandidate'}}
        input_stamp: {type: string}
        can_confirm: {type: boolean}
        wait_reason: {type: string}
    LibraryReuseCommand:
      type: object
      additionalProperties: false
      required: [target, source_file_id, confirmed_unit_ids, target_rel, action, input_stamp, confirmed]
      properties:
        target: {$ref: '#/components/schemas/LibraryReuseTarget'}
        source_file_id: {type: string, format: uuid}
        confirmed_unit_ids: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}}
        target_rel: {type: string, minLength: 1, maxLength: 1024}
        action: {type: string, enum: [hardlink, copy, reflink]}
        input_stamp: {type: string, pattern: '^[0-9a-f]{64}$'}
        confirmed: {type: boolean, enum: [true]}
    LibraryReuseReceipt:
      type: object
      required: [plan_id, job_id, state]
      properties:
        plan_id: {type: string, format: uuid}
        job_id: {type: string, format: uuid}
        state: {type: string}
    LibraryReuseStatus:
      type: object
      required: [plan_id, job_id, state, reason, root_id, source_file_id, target_rel, action, unit_ids]
      properties:
        plan_id: {type: string, format: uuid}
        job_id: {type: string, format: uuid}
        state: {type: string, enum: [queued, waiting, running, completed, review_required]}
        reason: {type: string}
        root_id: {type: string, format: uuid}
        source_file_id: {type: string, format: uuid}
        target_rel: {type: string}
        action: {type: string, enum: [hardlink, copy, reflink]}
        unit_ids: {type: array, items: {type: string, format: uuid}}
        target_file_id: {type: string, format: uuid}
    TransferRevisionPreview:
      type: object
      required: [plan_id, task_id, target_rel, original_target_rel, source_size, input_stamp, observed_at, revisable, reason]
      properties:
        plan_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        target_rel: {type: string}
        original_target_rel: {type: string}
        source_size: {type: integer, format: int64}
        media_type: {type: string, enum: [movie, tv]}
        unit_key: {type: string}
        action: {type: string, enum: [hardlink, copy, reflink, move]}

        input_stamp: {type: string}
        observed_at: {type: string, format: date-time}
        revisable: {type: boolean}
        reason: {type: string}
    TransferRevisionReceipt:
      type: object
      required: [previous_plan_id, plan_id, task_id, job_id, state]
      properties:
        previous_plan_id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        job_id: {type: string, format: uuid}
        state: {type: string, enum: [queued_revised_plan]}
    NotificationBatchSummary:
      type: object
      required: [id, media_id, channel_id, recipient_name, recipient_enabled, state, deadline, member_count, unit_count, file_count, root_count]
      properties:
        id: {type: string, format: uuid}
        media_id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        recipient_name: {type: string}
        recipient_enabled: {type: boolean}
        state: {type: string, enum: [collecting, sealing_pending, pending, delivering, delivered, dead, skipped, unavailable]}
        deadline: {type: string, format: date-time}
        event_id: {type: string, format: uuid}
        member_count: {type: integer}
        unit_count: {type: integer}
        file_count: {type: integer}
        root_count: {type: integer}

    NotificationChannelDetails:
      type: object
      required: [id, name, channel_type, is_enabled, updated_at]
      properties:
        replaced_by: {type: string, format: uuid, description: Successor only; historical deliveries still belong to this channel}
        id:
          type: string
          format: uuid
        name:
          type: string
        channel_type:
          type: string
        is_enabled:
          type: boolean
        updated_at: {type: string, format: date-time}
    ChannelReplacementRequest:
      type: object
      additionalProperties: false
      required: [expected_updated_at, name, channel_type, config, accept_old_pending]
      properties:
        expected_updated_at: {type: string, format: date-time}
        name: {type: string, minLength: 1, maxLength: 120}
        channel_type: {type: string, enum: [webhook, telegram]}
        accept_old_pending: {type: boolean, description: Explicit acknowledgement that historical waiting deliveries are not moved to the new channel}
        config:
          type: object
          writeOnly: true
          additionalProperties: false
          properties:
            url: {type: string, maxLength: 4000, writeOnly: true}
            secret: {type: string, maxLength: 1000, writeOnly: true}
            bot_token: {type: string, maxLength: 1000, writeOnly: true}
            chat_id: {type: string, maxLength: 1000, writeOnly: true}
    ChannelReplacementReceipt:
      type: object
      required: [old_channel_id, new_channel_id, old_enabled, new_enabled, old_updated_at, new_updated_at]
      properties:
        old_channel_id: {type: string, format: uuid}
        new_channel_id: {type: string, format: uuid}
        old_enabled: {type: boolean}
        new_enabled: {type: boolean}
        old_updated_at: {type: string, format: date-time}
        new_updated_at: {type: string, format: date-time}

    ChannelStateReceipt:
      type: object
      required: [id, is_enabled, updated_at]
      properties:
        id: {type: string, format: uuid}
        is_enabled: {type: boolean}
        updated_at: {type: string, format: date-time}
    CreateNotificationChannelRequest:
      type: object
      required: [name, channel_type, config]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        channel_type:
          type: string
          enum: [webhook, telegram]
        config:
          type: object
          writeOnly: true
          properties:
            url:
              type: string
              writeOnly: true
            secret:
              type: string
              writeOnly: true
            bot_token:
              type: string
              writeOnly: true
            chat_id:
              type: string
              writeOnly: true

    HealthStatus:
      type: object
      required: [alive, version]
      properties:
        alive:
          type: boolean
        version:
          type: string

    ReadyStatus:
      type: object
      required: [ready]
      properties:
        ready:
          type: boolean
        reason:
          type: string
        checks:
          type: object
          additionalProperties:
            type: boolean

    SystemStatus:
      type: object
      required: [version, db_ready, log_level]
      properties:
        version:
          type: string
        db_ready:
          type: boolean
        data_dir:
          type: string
          description: Filesystem data directory; omitted for members.
        log_level:
          type: string

    AuthStatus:
      type: object
      required: [initialized]
      properties:
        initialized:
          type: boolean
        current_user:
          $ref: '#/components/schemas/UserInfo'

    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
        token:
          type: string

    UserInfo:
      type: object
      required: [id, username, role, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, member]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    SettingItem:
      type: object
      required: [key, value, version, updated_at]
      properties:
        key:
          type: string
        value:
          type: object
          additionalProperties: true
        version:
          type: integer
        updated_at:
          type: string
          format: date-time

    SettingsListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettingItem'

    UpdateSettingRequest:
      type: object
      required: [value, expected_version]
      properties:
        value:
          type: object
          additionalProperties: true
        expected_version:
          type: integer

    CreateOwnTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        expires_at: {type: string, format: date-time}
    ManagedToken:
      type: object
      required: [id, name, scopes, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        scopes: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    ManagedTokenReceipt:
      type: object
      required: [item, replayed]
      properties:
        item: {$ref: '#/components/schemas/ManagedToken'}
        replayed: {type: boolean}
        secret: {type: string, description: Returned only for the initial successful create; never stored or replayed}

    ErrorResponse:
      type: object
      required: [type, title, status, detail, code, message, request_id]
      properties:
        type:
          type: string
          format: uri
          description: RFC 9457 problem type; about:blank uses the HTTP status meaning.
          example: about:blank
        title:
          type: string
          description: Stable HTTP status phrase for the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe public explanation, also retained as message for existing clients.
        code:
          type: string
          example: "UNAUTHORIZED"
        message:
          type: string
          example: "Authentication required"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: Safe client correlation token, or a generated ID when the supplied header is invalid or ambiguous.
          example: "018e0000-0000-7000-8000-000000000001"
        details:
          type: object
          additionalProperties: true

    AcquireMovieRequest:
      type: object
      required: [unit_id, root_id, candidate_id]
      properties:
        unit_id:
          type: string
          format: uuid
        root_id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid

    AcquireMovieResponse:
      type: object
      required: [operation_id, status]
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          example: "dispatched"

    OperationSummary:
      allOf:
        - $ref: '#/components/schemas/OperationDetails'
        - type: object
          required: [title, created_at]
          properties:
            title:
              type: string
            created_at:
              type: string
              format: date-time
    OperationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationSummary'
        next_cursor:
          type: string
    OperationDetails:
      type: object
      required: [operation_id, status]
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          example: "tracking"
          description: Overall lifecycle. A completed download remains organizing/waiting_organization or review_required until verified organization finishes.
        download_status:
          type: string
          example: "downloading"
        progress:
          type: number
          format: float
          example: 0.5
        plan_id:
          type: string
          format: uuid
          description: Persisted original plan identity, not execution authorization.
        plan_status:
          type: string
          example: "approved"
        facts:
          type: array
          items:
            type: string

    TransferPlanDetails:
      type: object
      required: [id, operation_id, state, strategy]
      properties:
        id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        state:
          type: string
          example: "approved"
        strategy:
          type: string
          example: "hardlink"

    MovieSearchResult:
      type: object
      required: [tmdb_id, title]
      properties:
        tmdb_id:
          type: integer
          format: int64
          example: 550
        title:
          type: string
          example: "Fight Club"
        year:
          type: integer
          example: 1999
        overview:
          type: string
        poster_url:
          type: string
        media_type:
          type: string
          enum: [movie, tv]
          default: movie

    MovieSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MovieSearchResult'


    CreateSubscriptionRequest:
      type: object
      properties:
        indexer_ids:
          type: array
          description: Explicit search endpoints for automatic single-movie fulfillment. Empty disables automatic search; omitted preserves existing bindings on reconfiguration.
          items:
            type: string
            format: uuid
        media_id:
          type: string
          format: uuid
        root_id:
          type: string
          format: uuid
        tmdb_id:
          type: integer
          format: int64
        media_type:
          type: string
          enum: [movie, tv]
          default: movie
        title:
          type: string
        year:
          type: integer
        scope_type:
          type: string
          enum: [all, selected]
          default: all
        quality_policy_id:
          type: string
          default: default
        seasons:
          type: array
          items:
            type: integer
        episodes:
          type: array
          items:
            type: string
          example: ["S01E01", "S01E02", "S01E03"]
        downloader_id:
          type: string
          format: uuid
        include_specials:
          type: boolean
          default: false
    WantedItemDetails:
      type: object
      required: [id, unit_id, is_skipped, is_satisfied]
      properties:
        user_skipped: {type: boolean}
        scope_excluded: {type: boolean}
        air_date: {type: string, format: date}
        absolute_number: {type: integer}
        retired: {type: boolean}
        metadata_version: {type: integer, format: int64}
        id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        unit_key:
          type: string
          example: "S01E01"
        is_skipped:
          type: boolean
        is_satisfied:
          type: boolean
        current_fact_stage:
          type: string
        wait_reason:
          type: string

    SubscriptionStatusReport:
      type: object
      required: [id, intent_version, policy_revision, root_generation, observed_at, blockers, items]
      properties:
        id: {type: string, format: uuid}
        intent_version: {type: integer, format: int64}
        policy_revision: {type: integer, format: int64}
        root_generation: {type: integer, format: int64}
        observed_at: {type: string, format: date-time}
        blockers:
          type: array
          items: {type: string}
        endpoint_retry_at: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/WantedStatusDetails'}
    WantedStatusDetails:
      type: object
      required: [id, unit_id, unit_key, facts_version, is_skipped, is_satisfied, reservation_protected, status]
      properties:
        id: {type: string, format: uuid}
        unit_id: {type: string, format: uuid}
        unit_key: {type: string}
        facts_version: {type: integer, format: int64}
        is_skipped: {type: boolean}
        is_satisfied: {type: boolean}
        reservation_protected: {type: boolean, description: "An active reservation in the requested target root remains protected, regardless of observation TTL or root availability."}
        status: {type: string, enum: [satisfied, missing, unknown, in_flight, waiting, skipped]}
        wait_reason: {type: string}
        current_fact_stage: {type: string, enum: [imported, submitted, downloaded]}
    SubscriptionDetails:
      type: object
      required: [id, user_id, media_id, root_id, state, intent_version, scope_type, quality_policy_id, quality_policy_revision]
      properties:
        selected_unit_ids: {type: array, items: {type: string, format: uuid}}
        seasons: {type: array, items: {type: integer}}
        include_specials: {type: boolean}
        indexer_ids:
          type: array
          items:
            type: string
            format: uuid
        downloader_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        media_id:
          type: string
          format: uuid
        root_id:
          type: string
          format: uuid
        title:
          type: string
          example: "绝命毒师 (Breaking Bad)"
        year:
          type: integer
          example: 2008
        media_type:
          type: string
          example: "tv"
        poster_url:
          type: string
        root_name:
          type: string
          example: "默认电视剧存储库"
        root_path:
          type: string
          description: Raw root path, present only for administrators. Members receive root_id and root_name.
          example: "/data/tv"
        total_episodes:
          type: integer
          example: 62
        satisfied_episodes:
          type: integer
          example: 16
        state:
          type: string
          example: "active"
        intent_version:
          type: integer
          example: 1
        scope_type:
          type: string
          example: "all"
        quality_policy_id:
          type: string
          example: "default"
        quality_policy_revision:
          type: integer
          example: 1
        wanted_items:
          type: array
          items:
            $ref: '#/components/schemas/WantedItemDetails'

    SubscriptionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionDetails'

    FileMappingUnit:
      type: object
      required: [id, media_id, unit_key, metadata_version, retired]
      properties:
        id: {type: string, format: uuid}
        media_id: {type: string, format: uuid}
        unit_key: {type: string}
        metadata_version: {type: integer, format: int64}
        retired: {type: boolean}
    FileMappingAssociation:
      type: object
      required: [unit, active]
      properties:
        unit: {$ref: '#/components/schemas/FileMappingUnit'}
        active: {type: boolean}
    FileMappingOptions:
      type: object
      required: [files, media, limit]
      properties:
        limit: {type: integer}
        files:
          type: array
          items:
            type: object
            required: [id, root_id, rel_path, root_name]
            properties:
              id: {type: string, format: uuid}
              root_id: {type: string, format: uuid}
              rel_path: {type: string}
              root_name: {type: string}
        media:
          type: array
          items:
            type: object
            required: [id, title, media_type]
            properties:
              id: {type: string, format: uuid}
              title: {type: string}
              media_type: {type: string}
    FileMappingPreview:
      type: object
      required: [file_id, root_id, rel_path, media_id, media_title, mapping_revision, input_stamp, can_correct, hold_reason, available_units, associations]
      properties:
        file_id: {type: string, format: uuid}
        root_id: {type: string, format: uuid}
        rel_path: {type: string}
        media_id: {type: string, format: uuid}
        media_title: {type: string}
        mapping_revision: {type: integer, format: int64}
        input_stamp: {type: string}
        can_correct: {type: boolean}
        hold_reason: {type: string}
        available_units: {type: array, items: {$ref: '#/components/schemas/FileMappingUnit'}}
        associations: {type: array, items: {$ref: '#/components/schemas/FileMappingAssociation'}}
    FileMappingReceipt:
      type: object
