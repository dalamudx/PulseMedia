      additionalProperties: false
      required: [name, protocol, url, categories]
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        protocol: {$ref: '#/components/schemas/IndexerProtocol'}
        url: {type: string, minLength: 1, maxLength: 8192, writeOnly: true}
        api_key: {type: string, maxLength: 8192, writeOnly: true, description: Empty credentials are valid for public sources}
        categories: {$ref: '#/components/schemas/IndexerCategories'}

