          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Consistent current database status, not cached wanted projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionStatusReport'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden object
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Missing subscription
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Could not observe status; never an empty success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
