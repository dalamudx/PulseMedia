root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  args_bin = []
  cmd = "go build -o ./tmp/main ./cmd/pulsemedia"
  delay = 500
  exclude_dir = ["web", "bin", "docs", "tmp", "testdata", ".git", ".data", "node_modules"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  include_ext = ["go", "yaml", "sql"]
  kill_delay = "1s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true
