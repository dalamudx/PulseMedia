name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare owned temporary paths
        run: |
          ci_tmp="/data/temp/pulse-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /data/temp "$ci_tmp"
          for key in TMPDIR TMP TEMP CI_OWNED_TEMP; do echo "$key=$ci_tmp" >> "$GITHUB_ENV"; done
          echo "GOLANGCI_LINT_CACHE=$ci_tmp/lint-cache" >> "$GITHUB_ENV"
      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Install and verify locked dependencies
        run: |
          mise exec -- pnpm --dir web install --frozen-lockfile
          mise exec -- go mod download
          mise exec -- go mod verify
      - name: Check frontend and development scripts
        run: |
          mise exec -- task test-web test-dev
          mise exec -- node --test web/tests/*.test.mjs
      - name: Build frontend and Go binaries
        run: |
          mise exec -- task build BIN_DIR="$CI_OWNED_TEMP/bin"
          "$CI_OWNED_TEMP/bin/pulsemedia" --version
      - name: Run domain unit tests
        run: mise exec -- go test ./internal/domain/... -count=1 -timeout=3m
      - name: Lint and check dependency boundaries
        run: mise exec -- task lint depguard-probe
      - name: Check generated code and API compatibility
        run: mise exec -- task gen-check api-probe
      - name: Scan for reachable vulnerabilities
        run: mise exec -- task vuln
      # PG/race, browser and container acceptance run on demand via existing
      # Taskfile targets and scripts/verify_m11_regression.sh, not on every push.
      - name: Remove owned temporary artifacts
        if: always()
        run: |
          if [ -n "${CI_OWNED_TEMP:-}" ]; then
            case "$CI_OWNED_TEMP" in
              "/data/temp/pulse-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}") rm -rf -- "$CI_OWNED_TEMP" ;;
              *) echo "Unexpected CI temporary path" >&2; exit 1 ;;
            esac
            test ! -e "$CI_OWNED_TEMP"
          fi
