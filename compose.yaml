services:
  pulsemedia:
    image: "${PULSE_APP_IMAGE:-localhost/pulsemedia:dev}"
    container_name: pulsemedia
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PULSE_HTTP_ADDR=0.0.0.0:8080
      - PULSE_DATABASE_URL=${PULSE_DATABASE_URL:?Set an explicit application connection string}
      - PULSE_DATA_DIR=/app/data
      - PULSE_LOG_LEVEL=info
    volumes:
      - pulse_data:/app/data
      - /mnt/media/movies:/media/movies
      - /mnt/media/tv:/media/tv
      - /mnt/downloads:/downloads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: "${PULSE_CONTAINER_BASE_IMAGE:?Run via mise exec}"
    container_name: pulsemedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsemedia
      POSTGRES_USER: pulseuser
      POSTGRES_PASSWORD: "${PULSE_POSTGRES_PASSWORD:?Set a unique database password}"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseuser -d pulsemedia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pulse_data:
  pg_data:
