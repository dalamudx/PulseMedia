  test-m8-automatic-tv-watch:
    desc: Verify exact-predecessor automatic TV hints without bypassing the two-second observation gate
    cmds:
      - bash scripts/verify_m8_automatic_tv_watch.sh

  test-m8-upgrade-watch:
    desc: Verify exact-predecessor movie upgrade hints while preserving the original thirty-second tracking gate
    cmds:
