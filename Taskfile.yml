  test-m8-download-watch:
    desc: Verify bounded Linux hints and ordinary tracking-to-hardlink acceleration with real App and PG18
    cmds:
      - bash scripts/verify_m8_download_watch.sh

  test-m8-complete-tv-watch:
    desc: Verify predecessor-bound COMPLETE-TV hint tracking with real inotify, App and PG18
    cmds:
