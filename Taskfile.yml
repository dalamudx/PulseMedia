  test-m8-site-account-stats-ui:
    desc: Verify persisted account statistics cards with Cookie, native NexusPHP, PG18 and isolated Chrome
    cmds:
      - bash scripts/verify_m8_site_account_stats_ui.sh

  test-m8-site-account-stats-runtime:
    desc: Verify periodic persisted account observations with Cookie, native NexusPHP and PG18
    cmds:
      - bash scripts/verify_m8_site_account_stats_runtime.sh

  test-m8-site-checkin-config:
    desc: Verify administrator daily check-in settings and original receipts without native I/O
    cmds:
      - bash scripts/verify_m8_site_checkin_config.sh

  test-m8-site-checkin-runtime:
    desc: Verify single native check-in, durable permission and observation-only recovery with Cookie and PG18
    cmds:
