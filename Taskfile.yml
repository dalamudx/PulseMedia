  test-m10-regression:
    desc: Run one current-source full M10 race regression shard with isolated PG18 and exact manifest coverage
    cmds:
      - bash scripts/verify_m10_regression.sh {{.CLI_ARGS}}

  test-m10-bangumi-discovery:
    desc: Verify Bangumi calendar browsing, explicit TMDB chase review and real Cookie Chrome subscription flow
    cmds:
      - bash scripts/verify_m10_bangumi_discovery.sh {{.CLI_ARGS}}

  test-m10-bangumi-calendar:
    desc: Verify native Bangumi weekday metadata, bilingual filters, read-only Cookie entry and original subscription compatibility
    cmds:
      - bash scripts/verify_m10_bangumi_calendar.sh {{.CLI_ARGS}}

  test-m10-cookiecloud-sync:
    desc: Verify encrypted CookieCloud end-to-end sync, scoped credential validity, atomic writeback and real App lifecycle with PG18
    cmds:
      - bash scripts/verify_m10_cookiecloud_sync.sh
  test-m9-regression:
    desc: Run the current complete Go race manifest in isolated PostgreSQL shards for M9 release validation
    cmds:
      - bash scripts/verify_m9_regression.sh {{.CLI_ARGS}}

  sqlc:
    desc: Generate sqlc code
    cmds:
      - sqlc generate

  api-probe:
    desc: Probe pinned OpenAPI generators using real nullable and UUID artifacts
    cmds:
      - node scripts/probe_openapi_generators.cjs
  generate-api-go:
    desc: Generate Go strict server from OpenAPI spec
    cmds:
      - oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml

  generate-api-ts:
    desc: Generate TypeScript schema from OpenAPI spec
    cmds:
      - pnpm --dir web exec openapi-typescript ../api/openapi.yaml -o src/api/schema.d.ts

  generate:
    desc: Run all code generators
    cmds:
      - task: sqlc
      - task: generate-api-go
      - task: generate-api-ts

  gen-check:
    desc: Verify that generated code matches specs with zero drift
    cmds:
      - |
        before="$(mktemp)"
        after="$(mktemp)"
        trap 'rm -f "$before" "$after"' EXIT
        find internal/store/postgres/db -name '*.go' -type f -print0 | sort -z | xargs -0 sha256sum > "$before"
        sha256sum internal/httpapi/api.gen.go web/src/api/schema.d.ts >> "$before"
        task generate
        find internal/store/postgres/db -name '*.go' -type f -print0 | sort -z | xargs -0 sha256sum > "$after"
        sha256sum internal/httpapi/api.gen.go web/src/api/schema.d.ts >> "$after"
        diff -u "$before" "$after"

  test:
    desc: Run Go tests
    cmds:
      - bash scripts/with_test_postgres.sh go test -v -p 2 ./...

  test-race:
    desc: Run Go tests with race detector
    cmds:
      - bash scripts/with_test_postgres.sh go test -race -v -p 2 ./...

  depguard-probe:
    desc: Prove compiling forbidden production imports fail the dependency gate
    cmds:
      - bash scripts/check_dependency_guards.sh

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vuln:
    desc: Require a successful govulncheck scan
    cmds:
      - govulncheck ./...

  clean:
    desc: Clean local build artifacts
    cmds:
      - rm -rf -- "{{.BIN_DIR}}" coverage.out
