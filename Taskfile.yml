  test-m8-untracked-scope:
    desc: Verify explicit untracked-directory configuration and persistent review boundaries without collection or import
    cmds:
      - bash scripts/verify_m8_untracked_scope.sh

  test-m8-untracked-discovery:
    desc: Verify persistent untracked video observations with real file events and read-only Cookie pagination
    cmds:
      - bash scripts/verify_m8_untracked_discovery.sh

  test-m8-untracked-review:
    desc: Verify persisted untracked identity suggestions and explicit confirmation with original receipts and no organization authority
    cmds:
      - bash scripts/verify_m8_untracked_review.sh

  test-m8-untracked-organization:
    desc: Verify explicit external file organization, permanent execution permission, observation recovery and atomic ingestion
    cmds:
      - bash scripts/verify_m8_untracked_organization.sh

  test-m8-untracked-commit-recovery:
    desc: Verify actual COMMIT receipt loss and exact native hardlink publication counts across rollback and restart
    cmds:
      - bash scripts/verify_m8_untracked_commit_recovery.sh

  test-m8-nfs-watch:
    desc: Verify actual NFS listener unavailability, remote-write periodic discovery and explicit organization with kernel NFS
    cmds:
      - bash scripts/verify_m8_nfs_watch.sh
  test-m8-site-account-stats-config:
    desc: Verify administrator account statistics settings and original receipts with Cookie and PG18
    cmds:
      - bash scripts/verify_m8_site_account_stats_config.sh

  test-m8-douban-config:
    desc: Verify persistent Douban wish settings and original receipts with Cookie and PG18
    cmds:
      - bash scripts/verify_m8_douban_config.sh

  test-m8-douban-wish:
    desc: Verify persistent wish sync through native Douban pages and TMDB to subscriptions with Cookie and PG18
    cmds:
      - bash scripts/verify_m8_douban_wish.sh

  test-m7-sidecar:
    desc: Verify automatic TV ingestion through sidecar jobs and confined NFO/artwork publication with PG18 and Chrome
    cmds:
      - bash scripts/verify_m7_sidecar.sh

  test-m7-douban:
    desc: Verify Douban rankings with native clients, TMDB identity mapping, Cookie and PG18
    cmds:
      - go test -race -count=1 ./internal/adapter/metadata/douban ./internal/usecase/ranking
      - bash scripts/with_podman_test_postgres.sh go test -race -count=1 -timeout=280s -v ./internal/app -run '^TestM7DoubanRankingNativeHTTPPG$'

  test-m7-templates:
    desc: Verify builtin indexer preset templates, categories, and autofill with PG18 and race
    cmds:
      - go test -race -count=1 ./internal/domain/indexer
      - go test -race -count=1 -run '^TestIndexerManagementListTemplates$' ./internal/usecase/search
      - go test -race -count=1 -run '^TestListIndexerTemplatesHTTP$' ./internal/httpapi
      - bash scripts/with_podman_test_postgres.sh go test -race -count=1 -timeout=280s -v ./internal/app -run '^TestM7IndexerTemplatesHTTPPG$'
      - cd web && pnpm typecheck && node --test tests/indexer-templates.test.mjs

  test-m7-live-logs:
    desc: Verify the live system log stream, redaction, level filter and viewer with PG18 and Chrome
    cmds:
      - go test -race -count=1 ./internal/platform/logging
      - go test -race -count=1 -run 'TestStreamSystemLogs|TestParseLogLevel|TestLiveLogStream|TestPublishLogDoesNot|TestHubReplay|TestActivityStreamOnlyReset' ./internal/httpapi
      - bash scripts/with_podman_test_postgres.sh go test -race -count=1 -timeout=200s -v ./internal/app -run '^TestM7LiveLogsAppHTTPPG$'
      - bash scripts/verify_m7_live_logs.sh all

  test-compact-controls-ui:
    desc: Verify long token names and policy original-key recovery at four widths with Cookie, PG18 and Chrome
    cmds:
      - bash scripts/verify_m6_compact_controls_ui.sh {{.CLI_ARGS}}

  test-media-details-ui:
