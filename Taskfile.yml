  test-discovery-boards-ui:
    desc: Verify five native TMDB feeds, filters, retry and late-response isolation with Cookie, PG18 and Chrome
    cmds:
      - bash scripts/verify_m5_discovery.sh boards

  test-discovery-douban-ui:
