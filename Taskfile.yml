version: '3'

vars:
  BIN_DIR: bin
  BINARY_NAME: pulsemedia

tasks:
  default:
    desc: Run tests and verify build
    cmds:
      - task: test-web
      - task: test
      - task: build

  build:
    desc: Build PulseMedia binary with embedded web frontend
    cmds:
      - task: build-web
      - task: build-go
      - task: build-backup
      - task: build-migrate

  build-go:
    desc: Build Go binary using the existing embedded frontend artifacts
    cmds:
      - mkdir -p -- "{{.BIN_DIR}}"
      - go build -v -o "{{.BIN_DIR}}/{{.BINARY_NAME}}" ./cmd/pulsemedia

  build-backup:
    desc: Build the offline encrypted backup and restore CLI (PG18 clients required at runtime)
    cmds:
      - mkdir -p -- "{{.BIN_DIR}}"
      - go build -v -o "{{.BIN_DIR}}/pulsebackup" ./cmd/pulsebackup

  build-migrate:
    desc: Build the offline schema installer and recovery-point-checked upgrade CLI
    cmds:
      - mkdir -p -- "{{.BIN_DIR}}"
      - go build -v -o "{{.BIN_DIR}}/pulsemigrate" ./cmd/pulsemigrate

  test-migrate:
    desc: Verify offline install and protected upgrades on private PostgreSQL 18
    cmds:
      - bash scripts/with_podman_test_postgres.sh go test -race ./internal/app/migration ./cmd/pulsemigrate -count=1 -timeout=6m -v

  test-backup:
    desc: Verify encrypted backup, TLS, new-database restore and isolation with private PostgreSQL 18
    cmds:
      - bash scripts/with_podman_test_postgres.sh go test -race ./internal/app/backup ./cmd/pulsebackup -count=1 -timeout=4m -v
  m4-performance:
    desc: Measure the optimized app with 1000 subscriptions, 100000 real files and 10 synthetic endpoints on private PG18
    cmds:
      - bash scripts/m4_performance.sh {{.CLI_ARGS}}

  m4-endpoint-performance:
    desc: Measure actual search calls across ten synthetic loopback endpoints with normal persistent budgets
    cmds:
      - bash scripts/m4_endpoint_performance.sh

  m4-scan-recovery-scale:
    desc: Verify 100000 catalog records with transactional faults and resumable missing reconciliation on private PG18
    cmds:
      - bash scripts/with_podman_test_postgres.sh env PULSE_M4_SCAN_SCALE=1 go test -race ./internal/store/postgres -run '^TestM4ScanFinalization100kDBOnly$' -count=1 -timeout=6m -v

  m4-nfs-faults:
    desc: Verify real private kernel NFS scan faults, physical exclusion and mount replacement with private PostgreSQL 18
    cmds:
      - bash scripts/m4_nfs_faults.sh

  m4-queue-fairness:
    desc: Verify aged jobs under backlog and repeated high-priority arrivals with private PostgreSQL 18
    cmds:
      - bash scripts/with_podman_test_postgres.sh go test -race ./internal/platform/jobs -run '^TestJobFairnessWithBacklogAndSustainedArrivals$' -count=1 -timeout=3m -v

  test-container:
    desc: Verify image install/upgrade, PG18 persistent layout and non-root runtime with embedded frontend
    cmds:
      - bash scripts/with_podman_test_postgres.sh go test -race ./internal/app -run '^TestContainer(RuntimeSmoke|InstallUpgrade|PG18VolumeLayout)$' -count=1 -timeout=6m -v


  build-container:
    desc: Build the non-root app, backup and migration image with mise-managed tools and PG18 clients (direct Podman)
    cmds:
      - bash scripts/build_container.sh {{.CLI_ARGS}}

  build-provenance-check:
    desc: Verify release builds require clean committed source using isolated real Git fixtures
    cmds:
      - bash scripts/check_build_revision.sh

  dev:
    desc: 一键启动本地开发环境（自动起库/执行迁移/集成qb与tr测试容器/前后端双热重载/退出时优雅销毁容器）
    cmds:
      - ./scripts/dev.sh

  m4-services-up:
    desc: Start isolated real M4 services with Podman (optional state directory after --)
    env:
      PULSE_M4_STATE_DIR: "{{.CLI_ARGS}}"
    cmds:
      - bash scripts/m4_services.sh up

  m4-services-status:
    desc: Show isolated M4 service state (state directory required after --)
    env:
      PULSE_M4_STATE_DIR: "{{.CLI_ARGS}}"
    cmds:
      - bash scripts/m4_services.sh status

  m4-services-check:
    desc: Check real downloaders, Jellyfin and Prowlarr (NAS and configured indexer acceptance remain separate)
    env:
      PULSE_M4_STATE_DIR: "{{.CLI_ARGS}}"
    cmds:
      - bash scripts/m4_services.sh check
  m4-restore-drill:
    desc: Verify real post-backup orphan tasks, file preservation and isolated restore (state directory after --)
    env:
      PULSE_M4_STATE_DIR: "{{.CLI_ARGS}}"
    cmds:
      - bash scripts/m4_services.sh orphans

  m4-r3-faults:
    desc: Check real downloader R3 boundaries with an isolated Podman PG18 (state directory after --)
    env:
      PULSE_M4_STATE_DIR: "{{.CLI_ARGS}}"
    cmds:
      - bash scripts/m4_services.sh faults

  m4-nfs-preflight:
    desc: Check isolated NFS mount prerequisites (exit 77 means blocked, not accepted)
    cmds:
      - bash scripts/m4_nfs_preflight.sh

  m4-services-stop:
    desc: Stop isolated M4 services, retaining their data (state directory required after --)
    env:
      PULSE_M4_STATE_DIR: "{{.CLI_ARGS}}"
    cmds:
      - bash scripts/m4_services.sh down
  build-web:
    desc: Build React 19 frontend application
    cmds:
      - cd web && pnpm build

  test-auth-ui:
    desc: Verify embedded authentication UI against an owned PostgreSQL cluster
    cmds:
      - bash scripts/verify_account_tokens_browser.sh auth

  test-dashboard-ui:
    desc: Verify dashboard counts and refresh recovery with private PostgreSQL and Chrome
    cmds:
      - |
        set -eu
        mkdir -p /data/temp
        pulse_dashboard_tmp=$(mktemp -d /data/temp/pulse-dashboard-ui.XXXXXX)
        trap 'pulse_dashboard_status=$?; case "$pulse_dashboard_tmp" in /data/temp/pulse-dashboard-ui.*) rm -rf -- "$pulse_dashboard_tmp" ;; *) exit 98 ;; esac; test ! -e "$pulse_dashboard_tmp" || exit 1; printf "OWNED_DASHBOARD_TEMP_CLEANUP_VERIFIED\n"; exit "$pulse_dashboard_status"' EXIT
        export TMPDIR="$pulse_dashboard_tmp" TMP="$pulse_dashboard_tmp" TEMP="$pulse_dashboard_tmp"
        export PULSE_DASHBOARD_REPO="$PWD" PULSE_DASHBOARD_TASK_ROOT="$pulse_dashboard_tmp"
        export PULSE_DASHBOARD_BROWSER=1 PULSE_DASHBOARD_ASSET_DIR="$pulse_dashboard_tmp/assets" PULSE_DASHBOARD_ARTIFACT_DIR="${PULSE_DASHBOARD_ARTIFACT_DIR:-$pulse_dashboard_tmp}"
        cat > "$pulse_dashboard_tmp/vite.config.mjs" <<'CONFIG'
        import {createRequire} from 'node:module';
        const load=createRequire(process.env.PULSE_DASHBOARD_REPO+'/web/package.json');
        const {default:react}=await import(load.resolve('@vitejs/plugin-react'));
        export default {
          root:process.env.PULSE_DASHBOARD_REPO+'/web',
          envDir:process.env.PULSE_DASHBOARD_TASK_ROOT,
          plugins:[react()],
          resolve:{alias:{'@':process.env.PULSE_DASHBOARD_REPO+'/web/src'}},
          build:{outDir:process.env.PULSE_DASHBOARD_ASSET_DIR,emptyOutDir:true}
        };
        CONFIG
        pnpm --dir web exec vite build --config "$pulse_dashboard_tmp/vite.config.mjs"
        bash scripts/with_test_postgres.sh go test ./internal/app -run "${PULSE_DASHBOARD_TEST_PATTERN:-^TestDashboardClassificationAndRefreshBrowser$}" -count=1 -v -timeout=2m

  test-subscription-list-ui:
    desc: Verify movie/TV subscription rendering and workflows with isolated assets, PostgreSQL and Chrome
    cmds:
      - bash scripts/verify_subscription_list_browser.sh

  test-sites-ui:
    desc: Verify managed indexers with native Torznab, Cookie, PG18 and Chrome
    cmds:
      - bash scripts/verify_m5_indexer_browser.sh {{.CLI_ARGS}}

  test-site-probes-ui:
    desc: Verify sequential native site probes, queue stop, version fences and responsive cards with Cookie, PG18 and Chrome
    cmds:
      - bash scripts/verify_m6_site_probes_ui.sh {{.CLI_ARGS}}

  test-operation-activity-api:
    desc: Verify persistent operation telemetry, timeline paging and current read permissions with Cookie, native protocols and PG18
    cmds:
      - bash scripts/verify_m6_operation_activity_api.sh {{.CLI_ARGS}}

  test-operation-activity-ui:
    desc: Verify live activity observations, ordered steps and original command interactions with Cookie, PG18 and isolated Chrome
    cmds:
      - bash scripts/verify_m6_operation_activity_ui.sh {{.CLI_ARGS}}

  test-interactive-search:
    desc: Verify progressive search with native sources, Cookie, PG18 and isolated Chrome
    cmds:
      - bash scripts/verify_m5_interactive_search.sh {{.CLI_ARGS}}

  test-subscription-creation:
    desc: Verify subscription creation and receipt recovery with native TMDB, Cookie, PG18 and isolated Chrome
    cmds:
      - bash scripts/verify_m5_subscription_creation.sh {{.CLI_ARGS}}

  test-discovery-ui:
    desc: Verify discovery filters and movie/TV manual acquisition with Cookie, PG18 and isolated Chrome
    cmds:
      - bash scripts/verify_m5_discovery.sh {{.CLI_ARGS}}

  test-media-details-api:
    desc: Verify movie/TV details, native cast and sparse episodes with Cookie and private PostgreSQL
    cmds:
      - bash scripts/verify_m6_media_details_api.sh

  test-media-library-ui:
    desc: Verify library catalog views, scoped reads and responsive layout with Cookie, PG18 and isolated Chrome
    cmds:
      - bash scripts/verify_m6_media_library_ui.sh {{.CLI_ARGS}}

  test-m6-journey-ui:
    desc: Verify dashboard subscription creation through native automatic TV and real hardlink ingestion in Chrome
    cmds:
      - bash scripts/verify_m6_journey_ui.sh

  test-m7-media-scrape:
    desc: Verify batch scraping receipts, current authorization and native NFO/artwork with PG18
    cmds:
      - go test -race -count=1 ./internal/usecase/mediascrape
      - bash scripts/with_podman_test_postgres.sh go test -race -count=1 -timeout=180s ./internal/store/mediascrape
      - bash scripts/verify_m7_media_scrape.sh

  test-m7-media-scrape-ui:
    desc: Verify explicit batch scraping and original receipt recovery in real Chrome
    cmds:
      - bash scripts/verify_m7_media_scrape_ui.sh
  test-m8-subtitle:
    desc: Verify isolated subtitle jobs, native Shooter protocol and protected SRT publication with PG18
    cmds:
      - bash scripts/verify_m8_subtitle.sh

  test-m8-shooter-live:
    desc: Verify native Shooter SRT download using a published protocol hash or an explicitly selected CC BY sample
    cmds:
      - bash scripts/verify_m8_shooter_live.sh {{.CLI_ARGS}}

  test-m8-subtitle-player:
